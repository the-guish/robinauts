[project]
name = "robinauts"
version = "0.1.0"
description = "Conversational agents that play fair: the Robinauts backend."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Robinauts Authors" }]
# FastAPI is pinned to the one minor version whose `APIRouter` somebody has
# read. `robinauts.legacy.api.access` reads two of its private route lists to check
# that nothing is served without a permission (ROUTE_LISTS), and
# `test_the_walk_knows_every_route_list_fastapi_keeps` pins the same range as
# READ_FASTAPI, so the metadata and the test say one thing rather than two.
# **Bumping this means opening `fastapi.routing.APIRouter`**, seeing which
# attributes hold routes, and updating ROUTE_LISTS and READ_FASTAPI to match.
# There is a backstop that needs no such knowledge -- a list of routes under a
# name nothing reads stops the deployment -- so a bump cannot quietly open a
# door either way; the range is what makes somebody look.
dependencies = [
    "ag-ui-protocol>=1.0,<2",
    # Anthropic's own SDK, which both engines reach the vendor through and
    # which the Pydantic AI adapter **imports**: the client is built there
    # rather than by the framework's provider, because the retries and the
    # headers that must be pinned are the client's and not the provider's
    # (docs/specs/agents.md). Imported rather than merely installed, so it is
    # a direct dependency and is pinned as one, exactly as `langsmith` is.
    "anthropic>=1.3,<2",
    "asyncpg>=0.30",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28",
    # `create_agent` and the middleware the LangGraph engine runs a turn on
    # (docs/specs/agents.md, "A turn"), and the framework's own MCP client.
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.2,<2",
    "langchain-core>=1.2,<2",
    "langchain-mcp-adapters>=0.1",
    # The OpenAI kinds, which both engines offer: `langchain-openai` for the
    # LangGraph engine, the `openai` extra of `pydantic-ai-slim` for the other.
    # The licences of the tree were settled in DEPENDENCIES.md (CNRI-Python for
    # `regex`, the "Excepted licence texts" row for `tiktoken`). `openai` is
    # pinned as a direct dependency for the reason `anthropic` is: both
    # adapters build the client themselves, so they import it.
    #
    # The upper bounds are the ten-day cooldown (.github/dependabot.yml):
    # langchain-openai 1.6.3 was published on 2026-09-21 and openai 3.15.0 on
    # 2026-09-18, and this was adopted on 2026-09-28. Dependabot raises them
    # once the window has passed.
    "langchain-openai>=1.6.2,<1.6.3",
    "langgraph>=1.2,<2",
    "langsmith>=0.3.45,<1",
    "openai>=3.14.1,<3.15",
    # The `mcp` extra brings the framework's MCP client (fastmcp), which is how
    # that engine reaches the tool servers (docs/specs/agents.md, "Tools").
    "pydantic-ai-slim[anthropic,mcp,openai]>=2.47,<3",
    # The ASGI server `robinauts start` runs (docs/specs/backend.md, "Web"),
    # imported by `robinauts.legacy.cli` and by nothing else -- the import-linter
    # contract below has named it since before it was a dependency. BSD-3-Clause,
    # bringing `click` (BSD-3-Clause) and `h11` (MIT), both already in the lock.
    # Not `uvicorn[standard]`: that adds `uvloop`, `httptools`, `watchfiles`,
    # `websockets` and `python-dotenv` -- a faster loop and a parser we have not
    # measured a need for, a reloader a deployment must not have, a protocol
    # this platform deliberately does not serve (robinauts.legacy.api.protection) and a
    # second way to set environment variables.
    #
    # The upper bound is the ten-day cooldown (.github/dependabot.yml): 0.53.0
    # was published on 2026-09-14 and this was adopted on 2026-09-23. Dependabot
    # raises it once the window has passed.
    "uvicorn>=0.52.4,<0.53",
]

# PEP 639. The three files a wheel of this project distributes other people's
# terms in -- this project's own licence, the attribution notice, and the
# notices of every package inside the JavaScript bundle, which the frontend
# build writes (docs/oss-checklist.md, "Releases") -- are named by the metadata
# hook in backend/hatch_build.py and are therefore dynamic. None of the three is
# under backend/ in the repository, and a PEP 639 glob cannot climb out of the
# project directory: the hook stages them here while the wheel is built, which
# has to happen before this field is read, and takes them away again.
dynamic = ["license-files"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "import-linter>=2.0",
]

[tool.uv]
# The platforms the project runs on, and the only ones the lock resolves for:
# Windows is not a target (docs/deployment.md). A package that another platform
# alone would need is then not locked, and the licence gate reads the lock
# whole (DEPENDENCIES.md).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[project.scripts]
robinauts = "robinauts.legacy.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The licence files, staged before the metadata is settled. See
# backend/hatch_build.py for why this is a metadata hook and the refusal below
# is a build hook.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/robinauts"]
# The built interface (`frontend/dist` -> `robinauts/ui/`, which is what
# `robinauts.legacy.app.packaged_ui` reads) and the refusal to build a wheel without
# it. Both are in the hook rather than in a `force-include` table here, because
# an **editable** install has no built frontend by design and a declared
# force-include is looked for whichever kind of build it is -- which would make
# `uv sync` fail in every checkout that has not run `npm run build`.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The same hook on the sdist target, where it adds and refuses nothing: the
# metadata hook stages the licence files for every build, and this is what
# takes them away again afterwards. The sdist is a copy of backend/ and is not
# the deliverable (backend/hatch_build.py).
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: isort, UP: pyupgrade, B: bugbear,
# PT018: one check per assert, so a failure names the check that failed
select = ["E", "F", "I", "UP", "B", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["robinauts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning is a failure: a deprecation, a resource left open, anything a
# dependency has to say. It must be fixed, or excepted by name here, rather
# than scrolled past in a green run.
#
# It does **not** cover the two things work in the background goes quiet with,
# and neither can pytest: "coroutine was never awaited" is raised inside the
# garbage collector, where nothing can turn it into a failure -- it reaches
# the warnings summary and no further -- and "task exception was never
# retrieved" is not a warning at all but a line the event loop logs. That is
# why robinauts.legacy.adapters.run_executor retrieves every exception itself, and
# why its tests install an exception handler on the loop and assert that it
# saw nothing.
filterwarnings = ["error"]
# The gate scripts are not part of the robinauts package, but their pure
# logic is tested like anything else.
pythonpath = ["src", "tests", "../scripts"]
markers = [
    "io: tests that touch the network, the file system, a database or a local server (slow)",
    # Counted at the end of a run: a build that sets ROBINAUTS_REQUIRE_POSTGRES
    # is failed if none of these ran. See tests/conftest.py.
    "database: tests that need the PostgreSQL named by ROBINAUTS_TEST_DATABASE_URL",
    "live: tests that call a real model provider with a real key, and cost money",
]
# `tests/live/` is never collected by a plain run, and therefore never by CI:
# those tests call a vendor with a real key and are run by hand, by naming the
# file (`uv run pytest tests/live/test_langgraph_live.py`). Not a marker
# expression in `addopts`, which would set `markexpr` on every run and so
# silence the check that the database tests really ran (tests/conftest.py).
#
# This setting REPLACES pytest's default list rather than adding to it, so the
# default is written out here with `live` on the end. Dropping any of the rest
# would send collection into a virtual environment or a build directory.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "live",
]


# ---------------------------------------------------------------------------
# Layer rules. docs/architecture/rules.md says them; these enforce them.
# Anything not allowed is forbidden. `legacy` keeps its old homes for the
# third-party libraries until it is removed.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "robinauts"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "agent_engines imports nothing from robinauts outside itself"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.agent_engines"]
forbidden_modules = ["robinauts.controller", "robinauts.web", "robinauts.legacy"]

[[tool.importlinter.contracts]]
name = "the engines' contract imports no engine"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.agent_engines.contract"]
forbidden_modules = [
    "robinauts.agent_engines.echo_engine",
    "robinauts.agent_engines.langchain_engine",
    "robinauts.agent_engines.pydantic_ai_engine",
]

[[tool.importlinter.contracts]]
name = "no engine imports another"
type = "independence"
modules = [
    "robinauts.agent_engines.echo_engine",
    "robinauts.agent_engines.langchain_engine",
    "robinauts.agent_engines.pydantic_ai_engine",
]

[[tool.importlinter.contracts]]
name = "controller imports only the engines' contract of the engines"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller"]
forbidden_modules = [
    "robinauts.agent_engines.echo_engine",
    "robinauts.agent_engines.langchain_engine",
    "robinauts.agent_engines.pydantic_ai_engine",
    "robinauts.web",
    "robinauts.legacy",
]

[[tool.importlinter.contracts]]
name = "the controller's contract imports nothing from robinauts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.contract"]
forbidden_modules = [
    "robinauts.controller.ports",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.controller.composition",
    "robinauts.agent_engines",
]

[[tool.importlinter.contracts]]
name = "controller.ports imports only the controller's contract"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.ports"]
forbidden_modules = [
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.controller.composition",
    "robinauts.agent_engines",
]

[[tool.importlinter.contracts]]
name = "controller.adapters imports only the contract and the ports"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.adapters"]
forbidden_modules = [
    "robinauts.controller.application",
    "robinauts.controller.composition",
    "robinauts.agent_engines",
]

[[tool.importlinter.contracts]]
name = "controller.application imports the contract, the ports and the engines' contract"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.application"]
forbidden_modules = ["robinauts.controller.adapters", "robinauts.controller.composition"]

[[tool.importlinter.contracts]]
name = "composition is imported by web alone"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.controller.contract",
    "robinauts.controller.ports",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.agent_engines",
]
forbidden_modules = ["robinauts.controller.composition"]

[[tool.importlinter.contracts]]
name = "web imports only the controller's contract and composition"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.web"]
forbidden_modules = [
    "robinauts.controller.ports",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.agent_engines",
    "robinauts.legacy",
]

[[tool.importlinter.contracts]]
name = "legacy imports nothing of the new layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.legacy"]
forbidden_modules = ["robinauts.agent_engines", "robinauts.controller", "robinauts.web"]

# --- third-party libraries: where each may be imported ----------------------
# The source is the whole package, so a module added tomorrow is inside the
# rule; the places that may import a library are written as exceptions.
# `unmatched_ignore_imports_alerting = "none"`: an exception that matches
# nothing (a client not installed, a module not written yet) leaves the rule
# stricter, never looser.

[[tool.importlinter.contracts]]
name = "LangChain, LangGraph, its provider clients and langsmith only under langchain_engine"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts"]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "langchain_anthropic",
    "langchain_openai",
    "langchain_google_genai",
    "langchain_aws",
    "langchain_mcp_adapters",
    "langsmith",
]
ignore_imports = [
    "robinauts.agent_engines.langchain_engine -> *",
    "robinauts.agent_engines.langchain_engine.** -> *",
    "robinauts.legacy.adapters.agents.langgraph -> *",
    "robinauts.legacy.adapters.agents.langgraph.** -> *",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Pydantic AI, fastmcp, logfire and OpenTelemetry only under pydantic_ai_engine"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts"]
forbidden_modules = [
    "pydantic_ai",
    "pydantic_graph",
    "fastmcp",
    "logfire",
    "logfire_api",
    "opentelemetry",
]
ignore_imports = [
    "robinauts.agent_engines.pydantic_ai_engine -> *",
    "robinauts.agent_engines.pydantic_ai_engine.** -> *",
    "robinauts.legacy.adapters.agents.pydantic_ai -> *",
    "robinauts.legacy.adapters.agents.pydantic_ai.** -> *",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "the Anthropic SDK, the OpenAI SDK and the MCP SDK only under the two framework engines"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts"]
forbidden_modules = ["anthropic", "openai", "mcp"]
ignore_imports = [
    "robinauts.agent_engines.langchain_engine -> *",
    "robinauts.agent_engines.langchain_engine.** -> *",
    "robinauts.agent_engines.pydantic_ai_engine -> *",
    "robinauts.agent_engines.pydantic_ai_engine.** -> *",
    "robinauts.legacy.adapters.agents.langgraph -> *",
    "robinauts.legacy.adapters.agents.langgraph.** -> *",
    "robinauts.legacy.adapters.agents.pydantic_ai -> *",
    "robinauts.legacy.adapters.agents.pydantic_ai.** -> *",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "database drivers only under the two framework engines and controller.adapters"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts"]
forbidden_modules = ["asyncpg", "sqlite3", "aiosqlite"]
ignore_imports = [
    "robinauts.agent_engines.langchain_engine -> *",
    "robinauts.agent_engines.langchain_engine.** -> *",
    "robinauts.agent_engines.pydantic_ai_engine -> *",
    "robinauts.agent_engines.pydantic_ai_engine.** -> *",
    "robinauts.controller.adapters -> *",
    "robinauts.controller.adapters.** -> *",
    "robinauts.legacy.datastore -> *",
    "robinauts.legacy.datastore.** -> *",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "httpx only under web and the two framework engines"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts"]
forbidden_modules = ["httpx"]
ignore_imports = [
    "robinauts.web -> *",
    "robinauts.web.** -> *",
    "robinauts.agent_engines.langchain_engine -> *",
    "robinauts.agent_engines.langchain_engine.** -> *",
    "robinauts.agent_engines.pydantic_ai_engine -> *",
    "robinauts.agent_engines.pydantic_ai_engine.** -> *",
    "robinauts.legacy.adapters -> *",
    "robinauts.legacy.adapters.** -> *",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "FastAPI, Starlette, uvicorn and ag_ui only under web"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "ag_ui"]
ignore_imports = [
    "robinauts.web -> *",
    "robinauts.web.** -> *",
    "robinauts.legacy.api -> *",
    "robinauts.legacy.api.** -> *",
    "robinauts.legacy.app -> *",
    "robinauts.legacy.cli -> *",
]
unmatched_ignore_imports_alerting = "none"
