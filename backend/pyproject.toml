[project]
name = "robinauts"
version = "0.1.0"
description = "Conversational agents that play fair: the Robinauts backend."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Robinauts Authors" }]
dependencies = [
    "ag-ui-protocol>=1.0,<2",
    # Anthropic's own SDK, which both engines reach the vendor through and
    # which the Pydantic AI adapter **imports**: the client is built there
    # rather than by the framework's provider, because the retries and the
    # headers that must be pinned are the client's and not the provider's
    # (docs/specs/agents.md). Imported rather than merely installed, so it is
    # a direct dependency and is pinned as one, exactly as `langsmith` is.
    "anthropic>=1.3,<2",
    "asyncpg>=0.30",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28",
    # `create_agent` and the middleware the LangGraph engine runs a turn on
    # (docs/specs/agents.md, "A turn"), and the framework's own MCP client.
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.2,<2",
    "langchain-core>=1.2,<2",
    "langchain-mcp-adapters>=0.1",
    # The OpenAI kinds, which both engines offer: `langchain-openai` for the
    # LangGraph engine, the `openai` extra of `pydantic-ai-slim` for the other.
    # The licences of the tree were settled in DEPENDENCIES.md (CNRI-Python for
    # `regex`, the "Excepted licence texts" row for `tiktoken`). `openai` is
    # pinned as a direct dependency for the reason `anthropic` is: both
    # adapters build the client themselves, so they import it.
    #
    # The upper bounds are the ten-day cooldown (.github/dependabot.yml):
    # langchain-openai 1.6.3 was published on 2026-09-21 and openai 3.15.0 on
    # 2026-09-18, and this was adopted on 2026-09-28. Dependabot raises them
    # once the window has passed.
    "langchain-openai>=1.6.2,<1.6.7",
    "langgraph>=1.2,<2",
    "langsmith>=0.3.45,<1",
    # neorc, embedded by `robinauts start` in the local development mode
    # (docs/architecture/orchestration.md), imported by `robinauts.cli` alone (the
    # import-linter contract below). `http` for its worker, `manager` for the
    # application mounted at /neorc and its UI, `postgres` for its store on
    # asyncpg. neorc-from-source: neorc publishes no wheels yet, so the sources
    # below pin a commit of open-shipyard/neorc's main (the asyncpg port, #78,
    # the UI's embedded mode, #82, the flow and loop graphs, #83 and #84, and
    # forms, task completion and queue pages, #85 to #87), and uv builds it
    # from there.
    "neorc[http,manager,postgres]",
    "neorc-core",
    "neorc-ui",
    "openai>=3.14.1,<3.38",
    # The `mcp` extra brings the framework's MCP client (fastmcp), which is how
    # that engine reaches the tool servers (docs/specs/agents.md, "Tools").
    "pydantic-ai-slim[anthropic,mcp,openai]>=2.47,<3",
    # The QR code a browser shows to link a phone (docs/architecture/device-pairing.md):
    # a module matrix, which `robinauts.web.pairing` draws as SVG itself, and which
    # nothing outside `robinauts.web` imports (the import-linter contract below). MIT,
    # pure Python, no dependencies; 1.8.0 was published on 2022-04-17. Not `segno`:
    # its metadata names its licence only by the trove classifier
    # `License :: OSI Approved :: BSD License`, which names no version of BSD, and the
    # licence gate refuses that for a runtime dependency (DEPENDENCIES.md).
    "qrcodegen>=1.8,<2",
    # The ASGI server `robinauts start` runs (docs/specs/backend.md, "Web"),
    # imported by `robinauts.cli.main` and by nothing else -- the import-linter
    # contract below has named it since before it was a dependency. BSD-3-Clause,
    # bringing `click` (BSD-3-Clause) and `h11` (MIT), both already in the lock.
    # Not `uvicorn[standard]`: that adds `uvloop`, `httptools`, `watchfiles`,
    # `websockets` and `python-dotenv` -- a faster loop and a parser we have not
    # measured a need for, a reloader a deployment must not have, a protocol
    # this platform deliberately does not serve and a
    # second way to set environment variables.
    #
    # The upper bound is the ten-day cooldown (.github/dependabot.yml): 0.53.0
    # was published on 2026-09-14 and this was adopted on 2026-09-23. Dependabot
    # raises it once the window has passed.
    "uvicorn>=0.52.4,<0.55",
]

# PEP 639. The three files a wheel of this project distributes other people's
# terms in -- this project's own licence, the attribution notice, and the
# notices of every package inside the JavaScript bundle, which the frontend
# build writes (docs/oss-checklist.md, "Releases") -- are named by the metadata
# hook in backend/hatch_build.py and are therefore dynamic. None of the three is
# under backend/ in the repository, and a PEP 639 glob cannot climb out of the
# project directory: the hook stages them here while the wheel is built, which
# has to happen before this field is read, and takes them away again.
dynamic = ["license-files"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "import-linter>=2.0",
    "playwright>=1.50",
    # Coverage of every test category, the server the API and e2e tests start included.
    # The upper bound on `coverage` is the ten-day cooldown (.github/dependabot.yml): 7.16.2
    # was published on 2026-09-27 and this was adopted on 2026-10-04.
    "pytest-cov>=7.1",
    "coverage>=7.16.1,<7.16.2",
]

[tool.uv]
# neorc-from-source: uv builds these three from the commit in [tool.uv.sources].
# `--no-build` holds for every other package
# (docs/architecture/orchestration.md, "Installing neorc").
no-binary-package = ["neorc", "neorc-core", "neorc-ui"]
# The platforms the project runs on, and the only ones the lock resolves for:
# Windows is not a target (docs/deployment.md). A package that another platform
# alone would need is then not locked, and the licence gate reads the lock
# whole (DEPENDENCIES.md).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
neorc = { git = "https://github.com/open-shipyard/neorc", rev = "26a30a0d6c3fa9521157f6ac6a038ca5603f1e87", subdirectory = "python/neorc" }
neorc-core = { git = "https://github.com/open-shipyard/neorc", rev = "26a30a0d6c3fa9521157f6ac6a038ca5603f1e87", subdirectory = "python/neorc-core" }
neorc-ui = { git = "https://github.com/open-shipyard/neorc", rev = "26a30a0d6c3fa9521157f6ac6a038ca5603f1e87", subdirectory = "python/neorc-ui" }

[project.scripts]
robinauts = "robinauts.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The licence files, staged before the metadata is settled. See
# backend/hatch_build.py for why this is a metadata hook and the refusal below
# is a build hook.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/robinauts"]
# The built interface (`frontend/dist` -> `robinauts/ui/`, which is what
# `robinauts.cli.main.interface` reads) and the refusal to build a wheel without
# it. Both are in the hook rather than in a `force-include` table here, because
# an **editable** install has no built frontend by design and a declared
# force-include is looked for whichever kind of build it is -- which would make
# `uv sync` fail in every checkout that has not run `npm run build`.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The same hook on the sdist target, where it adds and refuses nothing: the
# metadata hook stages the licence files for every build, and this is what
# takes them away again afterwards. The sdist is a copy of backend/ and is not
# the deliverable (backend/hatch_build.py).
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: isort, UP: pyupgrade, B: bugbear,
# PT018: one check per assert, so a failure names the check that failed
select = ["E", "F", "I", "UP", "B", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["robinauts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning is a failure: a deprecation, a resource left open, anything a
# dependency has to say. It must be fixed, or excepted by name here, rather
# than scrolled past in a green run.
#
# It does **not** cover the two things work in the background goes quiet with,
# and neither can pytest: "coroutine was never awaited" is raised inside the
# garbage collector, where nothing can turn it into a failure -- it reaches
# the warnings summary and no further -- and "task exception was never
# retrieved" is not a warning at all but a line the event loop logs.
filterwarnings = ["error"]
# The gate scripts are not part of the robinauts package, but their pure
# logic is tested like anything else.
pythonpath = ["src", "tests", "../scripts"]
markers = [
    "io: tests that touch the network, the file system, a database or a local server (slow)",
    # Counted at the end of a run: a build that sets ROBINAUTS_REQUIRE_POSTGRES
    # is failed if none of these ran. See tests/conftest.py.
    "database: tests that need the PostgreSQL named by ROBINAUTS_TEST_DATABASE_URL",
    "live: tests that call a real model provider with a real key, and cost money",
]
# `tests/adapters_metered/` is never collected by a plain run, and therefore never by CI:
# those tests call a vendor with a real key and are run by hand, by naming the
# file (`uv run pytest tests/adapters_metered/test_engines_live.py`). Not a marker
# expression in `addopts`, which would set `markexpr` on every run and so
# silence the check that the database tests really ran (tests/conftest.py).
#
# `tests/e2e/` is not collected by a plain run either: it needs a built
# interface and a browser, and scripts/check-e2e.sh runs it, after the fast
# tests.
#
# This setting REPLACES pytest's default list rather than adding to it, so the
# default is written out here with `adapters_metered` and `e2e` on the end. Dropping any of
# the rest would send collection into a virtual environment or a build
# directory.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "adapters_metered",
    "e2e",
]

# `uv run pytest --cov` measures a run. The `robinauts` servers that tests/api and tests/e2e
# start are measured too: `patch = ["subprocess"]` follows them, and `sigterm` saves their
# data when the tests stop them.
[tool.coverage.run]
source = ["robinauts"]
branch = true
parallel = true
patch = ["subprocess"]
sigterm = true
# The pytest process of an e2e run imports no `robinauts`: only its servers do.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
skip_covered = true
show_missing = true


# ---------------------------------------------------------------------------
# Layer rules. docs/architecture/rules.md says them; these enforce them.
# Anything not allowed is forbidden.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "robinauts"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared_domain imports nothing from robinauts outside itself"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.shared_domain"]
forbidden_modules = [
    "robinauts.agent_engines",
    "robinauts.controller",
    "robinauts.orchestrator",
    "robinauts.tools",
    "robinauts.worker",
    "robinauts.web",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "agent_engines imports nothing from robinauts outside itself"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.agent_engines"]
forbidden_modules = [
    "robinauts.shared_domain",
    "robinauts.controller",
    "robinauts.orchestrator",
    "robinauts.tools",
    "robinauts.worker",
    "robinauts.web",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "the engines' contract imports no engine"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.agent_engines.contract"]
forbidden_modules = [
    "robinauts.agent_engines.echo_engine",
    "robinauts.agent_engines.langchain_engine",
    "robinauts.agent_engines.pydantic_ai_engine",
]

[[tool.importlinter.contracts]]
name = "no engine imports another"
type = "independence"
modules = [
    "robinauts.agent_engines.echo_engine",
    "robinauts.agent_engines.langchain_engine",
    "robinauts.agent_engines.pydantic_ai_engine",
]

[[tool.importlinter.contracts]]
name = "controller imports nothing from robinauts outside itself but shared_domain"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller"]
forbidden_modules = [
    "robinauts.agent_engines",
    "robinauts.orchestrator",
    "robinauts.tools",
    "robinauts.worker",
    "robinauts.web",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "the controller's contract imports nothing from robinauts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.contract"]
forbidden_modules = [
    "robinauts.controller.ports",
    "robinauts.controller.core",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.cli",
    "robinauts.agent_engines",
    "robinauts.tools",
    "robinauts.worker",
]

[[tool.importlinter.contracts]]
name = "the controller's records do not import the broker's contract, which builds on them"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.contract.domain", "robinauts.controller.contract.ports"]
forbidden_modules = ["robinauts.controller.contract.broker"]

[[tool.importlinter.contracts]]
name = "controller.ports imports only the controller's contract"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.ports"]
forbidden_modules = [
    "robinauts.controller.core",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.cli",
    "robinauts.agent_engines",
    "robinauts.tools",
]

[[tool.importlinter.contracts]]
name = "controller.adapters imports only the contract and the ports"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.adapters"]
forbidden_modules = [
    "robinauts.controller.core",
    "robinauts.controller.application",
    "robinauts.cli",
    "robinauts.agent_engines",
    "robinauts.tools",
]

[[tool.importlinter.contracts]]
name = "controller.core imports the contract and the ports"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.core"]
forbidden_modules = [
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.cli",
    "robinauts.tools",
]

[[tool.importlinter.contracts]]
name = "controller.application imports the contract, the ports and the core"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.controller.application"]
forbidden_modules = [
    "robinauts.controller.adapters",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "web imports only the controller's and the orchestrator's contracts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.web"]
forbidden_modules = [
    "robinauts.cli",
    "robinauts.controller.core",
    "robinauts.controller.ports",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.orchestrator.ports",
    "robinauts.orchestrator.core",
    "robinauts.orchestrator.adapters",
    "robinauts.orchestrator.application",
    "robinauts.agent_engines",
    "robinauts.tools",
    "robinauts.worker",
]

# --- web's contract --------------------------------------------------------------
# What another package may import of web. A new module of web adds itself to the list.

[[tool.importlinter.contracts]]
name = "web's contract imports only the controller's and the orchestrator's contracts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.web.contract"]
forbidden_modules = [
    "robinauts.web.agui",
    "robinauts.web.app",
    "robinauts.web.apps",
    "robinauts.web.changes",
    "robinauts.web.cookies",
    "robinauts.web.headers",
    "robinauts.web.logs",
    "robinauts.web.mcp_client",
    "robinauts.web.oidc",
    "robinauts.web.pairing",
    "robinauts.web.sign_in",
    "robinauts.web.worker_api",
    "robinauts.controller.ports",
    "robinauts.controller.core",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.orchestrator.ports",
    "robinauts.orchestrator.core",
    "robinauts.orchestrator.adapters",
    "robinauts.orchestrator.application",
    "robinauts.cli",
    "robinauts.agent_engines",
    "robinauts.tools",
    "robinauts.worker",
]

# --- worker --------------------------------------------------------------------
# A sibling of the controller, which it reaches through the turn broker alone:
# controller.contract.broker, and web.contract.broker over HTTP.

[[tool.importlinter.contracts]]
name = "worker imports the broker's contracts, shared_domain, and the engines' and tools' contracts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.worker"]
forbidden_modules = [
    "robinauts.controller.contract.domain",
    "robinauts.controller.contract.ports",
    "robinauts.controller.ports",
    "robinauts.controller.core",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.orchestrator",
    "robinauts.cli",
    "robinauts.agent_engines.echo_engine",
    "robinauts.agent_engines.langchain_engine",
    "robinauts.agent_engines.pydantic_ai_engine",
    "robinauts.tools.sessions",
    "robinauts.web",
]
# The one part of web the worker may see: the HTTP its turn broker speaks to the server.
ignore_imports = ["robinauts.worker.** -> robinauts.web.contract.broker.**"]

[[tool.importlinter.contracts]]
name = "the worker is named by cli.composition alone"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.shared_domain",
    "robinauts.agent_engines",
    "robinauts.controller",
    "robinauts.tools",
    "robinauts.web",
    "robinauts.cli",
]
forbidden_modules = ["robinauts.worker"]
ignore_imports = ["robinauts.cli.composition -> robinauts.worker.*"]

# --- orchestrator ----------------------------------------------------------------
# A sibling of the controller: flows and their runs, on neorc. It may see the
# controller's contract; nothing of the controller sees it (above).

[[tool.importlinter.contracts]]
name = "orchestrator imports shared_domain and the controller's contract alone"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.orchestrator"]
forbidden_modules = [
    "robinauts.controller.ports",
    "robinauts.controller.core",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.agent_engines",
    "robinauts.tools",
    "robinauts.worker",
    "robinauts.web",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "the orchestrator's contract imports nothing from robinauts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.orchestrator.contract"]
forbidden_modules = [
    "robinauts.orchestrator.ports",
    "robinauts.orchestrator.core",
    "robinauts.orchestrator.adapters",
    "robinauts.orchestrator.application",
    "robinauts.controller",
    "robinauts.shared_domain",
]

[[tool.importlinter.contracts]]
name = "orchestrator.ports imports only the orchestrator's contract"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.orchestrator.ports"]
forbidden_modules = [
    "robinauts.orchestrator.core",
    "robinauts.orchestrator.adapters",
    "robinauts.orchestrator.application",
]

[[tool.importlinter.contracts]]
name = "orchestrator.core imports the contracts and the ports"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.orchestrator.core"]
forbidden_modules = [
    "robinauts.orchestrator.adapters",
    "robinauts.orchestrator.application",
]

[[tool.importlinter.contracts]]
name = "orchestrator.adapters imports the contracts and the ports"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.orchestrator.adapters"]
forbidden_modules = [
    "robinauts.orchestrator.core",
    "robinauts.orchestrator.application",
]

[[tool.importlinter.contracts]]
name = "orchestrator.application imports the contracts, the ports and the core"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.orchestrator.application"]
forbidden_modules = ["robinauts.orchestrator.adapters"]

# --- cli -----------------------------------------------------------------------
# What runs Robinauts: it builds the parts with composition and runs web over them.

[[tool.importlinter.contracts]]
name = "cli imports web and the controller's and the orchestrator's contracts, but for its composition"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.cli"]
forbidden_modules = [
    "robinauts.controller.ports",
    "robinauts.controller.core",
    "robinauts.controller.adapters",
    "robinauts.controller.application",
    "robinauts.orchestrator.ports",
    "robinauts.orchestrator.core",
    "robinauts.orchestrator.adapters",
    "robinauts.orchestrator.application",
    "robinauts.agent_engines",
    "robinauts.tools",
    "robinauts.worker",
]
# cli.composition builds every part, so it imports what the rest of cli may not;
# cli.orchestration builds the orchestrator, apart from it (the contract below).
ignore_imports = [
    "robinauts.cli.composition -> robinauts.**",
    "robinauts.cli.orchestration -> robinauts.orchestrator.**",
]

[[tool.importlinter.contracts]]
name = "nothing a worker in a process of its own imports reaches neorc"
type = "forbidden"
# Indirect imports count: the extra workers' images leave neorc out. They also read the
# flows' settings with the orchestrator's own parser (extra-workers/worker-common).
source_modules = [
    "robinauts.cli.worker_process",
    "robinauts.cli.composition",
    "robinauts.orchestrator.contract",
    "robinauts.orchestrator.core.config",
]
forbidden_modules = ["neorc", "neorc_core", "neorc_ui"]

[[tool.importlinter.contracts]]
name = "nothing imports cli"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.shared_domain",
    "robinauts.agent_engines",
    "robinauts.controller",
    "robinauts.tools",
    "robinauts.worker",
    "robinauts.web",
    "robinauts.orchestrator",
]
forbidden_modules = ["robinauts.cli"]

# --- tools ---------------------------------------------------------------------
# Everything about a tool is in its package. A new tool adds its package to the
# lists below, as a new engine does above: to `forbidden_modules` of the second
# rule, and to its `source_modules` too, which keeps tools from importing one
# another.

[[tool.importlinter.contracts]]
name = "tools import the tools' contract and the engines' contract"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.tools"]
forbidden_modules = [
    "robinauts.controller",
    "robinauts.orchestrator",
    "robinauts.cli",
    "robinauts.agent_engines.echo_engine",
    "robinauts.agent_engines.langchain_engine",
    "robinauts.agent_engines.pydantic_ai_engine",
    "robinauts.worker",
    "robinauts.web",
]

# A source that holds the forbidden module is not checked, so the layers are
# named one by one rather than as `robinauts`.
[[tool.importlinter.contracts]]
name = "a tool is named by cli.composition alone"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.agent_engines",
    "robinauts.controller",
    "robinauts.worker",
    "robinauts.web",
    "robinauts.cli",
    "robinauts.tools.contract",
]
forbidden_modules = ["robinauts.tools.sessions"]
ignore_imports = ["robinauts.cli.composition -> robinauts.tools.sessions"]

# --- third-party libraries: where each may be imported ----------------------
# The source is the whole package, so a module added tomorrow is inside the
# rule; the places that may import a library are written as exceptions.
# `unmatched_ignore_imports_alerting = "none"`: an exception that matches
# nothing (a client not installed, a module not written yet) leaves the rule
# stricter, never looser.

[[tool.importlinter.contracts]]
name = "LangChain, LangGraph, its provider clients and langsmith only under langchain_engine"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts"]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "langchain_anthropic",
    "langchain_openai",
    "langchain_google_genai",
    "langchain_aws",
    "langchain_mcp_adapters",
    "langsmith",
]
ignore_imports = [
    "robinauts.agent_engines.langchain_engine -> *",
    "robinauts.agent_engines.langchain_engine.** -> *",
]
unmatched_ignore_imports_alerting = "none"

