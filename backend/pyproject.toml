[project]
name = "robinauts"
version = "0.1.0"
description = "Conversational agents that play fair: the Robinauts backend."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Robinauts Authors" }]
# FastAPI is pinned to the one minor version whose `APIRouter` somebody has
# read. `robinauts.api.access` reads two of its private route lists to check
# that nothing is served without a permission (ROUTE_LISTS), and
# `test_the_walk_knows_every_route_list_fastapi_keeps` pins the same range as
# READ_FASTAPI, so the metadata and the test say one thing rather than two.
# **Bumping this means opening `fastapi.routing.APIRouter`**, seeing which
# attributes hold routes, and updating ROUTE_LISTS and READ_FASTAPI to match.
# There is a backstop that needs no such knowledge -- a list of routes under a
# name nothing reads stops the deployment -- so a bump cannot quietly open a
# door either way; the range is what makes somebody look.
dependencies = [
    "ag-ui-protocol>=1.0,<2",
    # Anthropic's own SDK, which both engines reach the vendor through and
    # which the Pydantic AI adapter **imports**: the client is built there
    # rather than by the framework's provider, because the retries and the
    # headers that must be pinned are the client's and not the provider's
    # (docs/specs/agents.md). Imported rather than merely installed, so it is
    # a direct dependency and is pinned as one, exactly as `langsmith` is.
    "anthropic>=1.3,<2",
    "asyncpg>=0.30",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28",
    "langchain-anthropic>=1.2,<2",
    "langchain-core>=1.2,<2",
    "langgraph>=1.2,<2",
    "langsmith>=0.3.45,<1",
    "pydantic-ai-slim[anthropic]>=2.47,<3",
    # The ASGI server `robinauts start` runs (docs/specs/backend.md, "Web"),
    # imported by `robinauts.cli` and by nothing else -- the import-linter
    # contract below has named it since before it was a dependency. BSD-3-Clause,
    # bringing `click` (BSD-3-Clause) and `h11` (MIT), both already in the lock.
    # Not `uvicorn[standard]`: that adds `uvloop`, `httptools`, `watchfiles`,
    # `websockets` and `python-dotenv` -- a faster loop and a parser we have not
    # measured a need for, a reloader a deployment must not have, a protocol
    # this platform deliberately does not serve (robinauts.api.protection) and a
    # second way to set environment variables.
    #
    # The upper bound is the ten-day cooldown (.github/dependabot.yml): 0.53.0
    # was published on 2026-09-14 and this was adopted on 2026-09-23. Dependabot
    # raises it once the window has passed.
    "uvicorn>=0.52.4,<0.53",
]

# PEP 639. The three files a wheel of this project distributes other people's
# terms in -- this project's own licence, the attribution notice, and the
# notices of every package inside the JavaScript bundle, which the frontend
# build writes (docs/oss-checklist.md, "Releases") -- are named by the metadata
# hook in backend/hatch_build.py and are therefore dynamic. None of the three is
# under backend/ in the repository, and a PEP 639 glob cannot climb out of the
# project directory: the hook stages them here while the wheel is built, which
# has to happen before this field is read, and takes them away again.
dynamic = ["license-files"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "import-linter>=2.0",
]

[project.scripts]
robinauts = "robinauts.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The licence files, staged before the metadata is settled. See
# backend/hatch_build.py for why this is a metadata hook and the refusal below
# is a build hook.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/robinauts"]
# The built interface (`frontend/dist` -> `robinauts/ui/`, which is what
# `robinauts.app.packaged_ui` reads) and the refusal to build a wheel without
# it. Both are in the hook rather than in a `force-include` table here, because
# an **editable** install has no built frontend by design and a declared
# force-include is looked for whichever kind of build it is -- which would make
# `uv sync` fail in every checkout that has not run `npm run build`.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The same hook on the sdist target, where it adds and refuses nothing: the
# metadata hook stages the licence files for every build, and this is what
# takes them away again afterwards. The sdist is a copy of backend/ and is not
# the deliverable (backend/hatch_build.py).
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["robinauts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning is a failure: a deprecation, a resource left open, anything a
# dependency has to say. It must be fixed, or excepted by name here, rather
# than scrolled past in a green run.
#
# It does **not** cover the two things work in the background goes quiet with,
# and neither can pytest: "coroutine was never awaited" is raised inside the
# garbage collector, where nothing can turn it into a failure -- it reaches
# the warnings summary and no further -- and "task exception was never
# retrieved" is not a warning at all but a line the event loop logs. That is
# why robinauts.adapters.run_executor retrieves every exception itself, and
# why its tests install an exception handler on the loop and assert that it
# saw nothing.
filterwarnings = ["error"]
# The gate scripts are not part of the robinauts package, but their pure
# logic is tested like anything else.
pythonpath = ["src", "tests", "../scripts"]
markers = [
    "io: tests that touch the network, the file system, a database or a local server (slow)",
    # Counted at the end of a run: a build that sets ROBINAUTS_REQUIRE_POSTGRES
    # is failed if none of these ran. See tests/conftest.py.
    "database: tests that need the PostgreSQL named by ROBINAUTS_TEST_DATABASE_URL",
    "live: tests that call a real model provider with a real key, and cost money",
]
# `tests/live/` is never collected by a plain run, and therefore never by CI:
# those tests call a vendor with a real key and are run by hand, by naming the
# file (`uv run pytest tests/live/test_langgraph_live.py`). Not a marker
# expression in `addopts`, which would set `markexpr` on every run and so
# silence the check that the database tests really ran (tests/conftest.py).
#
# This setting REPLACES pytest's default list rather than adding to it, so the
# default is written out here with `live` on the end. Dropping any of the rest
# would send collection into a virtual environment or a build directory.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "live",
]

# ---------------------------------------------------------------------------
# Architecture rules. See docs/layout.md section 3 for the dependency matrix.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "robinauts"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports nothing from robinauts"
type = "forbidden"
source_modules = ["robinauts.domain"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "core imports only domain"
type = "forbidden"
source_modules = ["robinauts.core"]
forbidden_modules = [
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "ports import only domain"
type = "forbidden"
source_modules = ["robinauts.ports"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "application imports only ports, core and domain"
type = "forbidden"
source_modules = ["robinauts.application"]
forbidden_modules = [
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

# Direct imports only. `api` calls the application, and the application
# imports core and ports, so every one of those is something `api` reaches
# indirectly the moment it has a route -- which is allowed and unavoidable.
# The rule is that `api` itself never names them (docs/layout.md section 5).
[[tool.importlinter.contracts]]
name = "api imports only application and domain"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["robinauts.api"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.ports",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "adapters import only ports and domain"
type = "forbidden"
source_modules = ["robinauts.adapters"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "datastore imports only ports and domain"
type = "forbidden"
source_modules = ["robinauts.datastore"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.app",
    "robinauts.cli",
]

# The database driver is confined to datastore, like each agent framework to
# its adapter: no SQL and no connection anywhere else (docs/layout.md).
#
# `allow_indirect_imports` on every library contract below. The rule each one
# states is "this module must not import the library ITSELF"; reaching it
# through the one package that may is the whole point of that package. Without
# it, the composition root -- whose job is to import `adapters` and
# `datastore` -- would break all four contracts the day it is written, and the
# only way to keep them green would be to stop it importing them at all. What
# stops a library leaking sideways is the layer contracts above: nothing but
# infrastructure may import `adapters` or `datastore` in the first place.
[[tool.importlinter.contracts]]
name = "asyncpg only under datastore"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = ["asyncpg"]

# The HTTP client is confined to adapters, like the driver to datastore: the
# platform's outbound traffic is the identity provider and the model providers,
# and both are adapters (docs/layout.md, "Third-party libraries").
[[tool.importlinter.contracts]]
name = "httpx only under adapters"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = ["httpx"]

# The web framework is confined to the inbound side and the composition root
# (docs/specs/backend.md, "Web"): the application never sees a request object,
# and nothing below `api` knows that HTTP is how anybody reached it. Direct
# imports, like the contracts above: `app.py` imports `api`, which imports
# FastAPI, and that is the point of `api`.
#
# `uvicorn` is named here before it is a dependency at all. It arrives with
# `robinauts start` (the CLI step), it belongs to infrastructure alone, and a
# contract written the day the import is written is a contract written after
# the fact.
[[tool.importlinter.contracts]]
name = "FastAPI, Starlette and uvicorn only under api and infrastructure"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.adapters",
    "robinauts.datastore",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

# AG-UI is the wire's vocabulary and nothing else's (docs/specs/wire.md): the
# application yields the platform's own turn events and `api` maps them, so a
# second wire -- or a client that cannot stream -- is another mapping rather
# than a change to anything below. Confined more tightly than the web
# framework, which the composition root also imports: nothing outside `api`
# has an AG-UI event to build, `app.py` included, so `app` and `cli` are
# sources here.
[[tool.importlinter.contracts]]
name = "ag_ui only under api"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = ["ag_ui"]

# The agent frameworks are swappable: each is confined to its own adapter.
# Every provider client is named, installed or not: `langchain-openai` and the
# rest arrive the day a provider's tree passes the licence policy, and a
# contract written then would be a contract written after the fact.
[[tool.importlinter.contracts]]
name = "LangGraph, LangChain, its provider clients and langsmith only under adapters.agents.langgraph"
type = "forbidden"
allow_indirect_imports = true
#
# `robinauts.adapters` is named as a **package**, so every module under it is a
# source -- including one added tomorrow, which a hand-written list would have
# left outside the rule until somebody remembered to add it. The one
# sub-package that may import the framework is the exception below, and it is
# written as an exception rather than as an omission.
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.adapters",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "langchain_anthropic",
    "langchain_openai",
    "langchain_google_genai",
    "langchain_aws",
    # Imported by the adapter for one call -- `langsmith.configure(enabled=
    # False)`, which is how hosted tracing is turned off -- and for nothing
    # else. Naming it here is what keeps "nothing phones home" from becoming
    # an import somewhere nobody was looking (docs/specs/agents.md).
    "langsmith",
]
# The exception, and the only one: the sub-package the framework belongs to.
# `-> *` rather than a list of the modules above, so that a framework added to
# the list tomorrow is forbidden everywhere and allowed here, which is the
# rule -- and so that the exception cannot quietly grow to cover a module
# outside this sub-package.
ignore_imports = [
    "robinauts.adapters.agents.langgraph -> *",
    "robinauts.adapters.agents.langgraph.** -> *",
]
# An expression that matches nothing is not an error: most of the clients
# above are not installed, so most of these exceptions have nothing to ignore.
# An exception that matches nothing leaves the contract stricter, never looser.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Pydantic AI, logfire and OpenTelemetry only under adapters.agents.pydantic_ai"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.adapters",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = [
    # The framework and the graph library it runs its agents on. A provider
    # client of Pydantic AI's is a module *inside* `pydantic_ai`, not a
    # distribution of its own, so unlike the LangGraph contract there is no
    # list of clients to write out: the day OpenAI's tree passes the licence
    # policy, this rule already covers it.
    "pydantic_ai",
    "pydantic_graph",
    # Pydantic AI's hosted observability, and the tracing API underneath it.
    # `logfire_api` arrives with `pydantic-graph` and `opentelemetry-api` with
    # `pydantic-ai-slim`; neither is imported by this platform at all, and
    # naming them here is what keeps "nothing phones home" from becoming an
    # import somewhere nobody was looking (docs/specs/agents.md). The adapter
    # turns instrumentation off with the framework's own switch and needs no
    # import of either, so the exception below is what they are allowed by and
    # not what they are used through.
    "logfire",
    "logfire_api",
    "opentelemetry",
]
ignore_imports = [
    "robinauts.adapters.agents.pydantic_ai -> *",
    "robinauts.adapters.agents.pydantic_ai.** -> *",
]
unmatched_ignore_imports_alerting = "none"

# The vendor's own SDK, which is neither framework's and which both engines
# end up on: `langchain-anthropic` is built on it, and the Pydantic AI adapter
# imports it directly to build the client with the retries and the headers
# pinned. It is confined to the two agent sub-packages for the same reason the
# frameworks are -- a model call belongs to an engine, and a key is what
# travels in one, so an `anthropic` import anywhere else is a second way to
# reach a vendor that no contract suite covers (docs/layout.md).
[[tool.importlinter.contracts]]
name = "the Anthropic SDK only under the two agent adapters"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.adapters",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = ["anthropic"]
ignore_imports = [
    "robinauts.adapters.agents.langgraph -> *",
    "robinauts.adapters.agents.langgraph.** -> *",
    "robinauts.adapters.agents.pydantic_ai -> *",
    "robinauts.adapters.agents.pydantic_ai.** -> *",
]
unmatched_ignore_imports_alerting = "none"

# The MCP Python SDK, confined to the one adapter that speaks the protocol --
# and **not adopted**: its tree fails the licence gate (DEPENDENCIES.md, "Known
# exclusions": `cffi` states MIT-0, which is on no list, and `pywin32` a
# licence family only), so `adapters/tools/mcp/` is a client of our own over
# `httpx` for the three calls a client needs (docs/specs/agents.md, "Known
# findings").
# The rule is written all the same, before the import exists, as `uvicorn`'s
# was: the day the tree passes, the SDK belongs here and nowhere else, and a
# contract written the day the import is written is a contract written after
# the fact. Same shape as the two framework rules above -- `robinauts.adapters`
# named as a package, the exception written as an exception.
[[tool.importlinter.contracts]]
name = "the MCP SDK only under adapters.tools.mcp"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.adapters",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = ["mcp"]
ignore_imports = [
    "robinauts.adapters.tools.mcp -> *",
    "robinauts.adapters.tools.mcp.** -> *",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "the two agent adapters do not import each other"
type = "independence"
modules = [
    "robinauts.adapters.agents.langgraph",
    "robinauts.adapters.agents.pydantic_ai",
]
