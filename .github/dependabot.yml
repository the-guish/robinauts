#
# A dependency change is a pull request of its own (DEPENDENCIES.md), and the
# licence gate runs on it like on any other. The cooldown keeps us off a
# release that is withdrawn or fixed in its first days -- a window in which
# compromised packages are usually caught.

version: 2
updates:
  # The Python backend. "uv" is the ecosystem that understands uv.lock; "pip"
  # would read pyproject.toml alone and leave the lock behind.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "backend"

  # The frontend. Exact versions in package.json and a committed
  # package-lock.json, so an update is a diff somebody reads
  # (docs/contributing/js-dependencies.md).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    # TypeScript 7.0 ships without a compiler API, which typescript-eslint
    # needs; 7.1 is expected to bring one. Lift this once 7.1 is proposed.
    ignore:
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    commit-message:
      prefix: "frontend"

  # The extra workers, each a uv project of its own (extra-workers/README.md).
  - package-ecosystem: "uv"
    directory: "/extra-workers/base-worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "base-worker"
  - package-ecosystem: "uv"
    directory: "/extra-workers/claude-code-worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "claude-code-worker"

  # The MCP servers, each a uv project of its own (mcp/README.md).
  - package-ecosystem: "uv"
    directory: "/mcp/to-do-list"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "to-do-list"

  - package-ecosystem: "uv"
    directory: "/mcp/diagrams"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "diagrams"

  # The actions this repository's workflows run, pinned to commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
