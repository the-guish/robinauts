#
# Unofficial example: the services of this demo, published on this machine's
# loopback only.
#
#   db       PostgreSQL 16 (the version the repo demo runs), data in a volume
#   fetch    mcp-server-fetch (plain HTTP, page to markdown) behind mcp-proxy
#   browser  Playwright MCP, headless Chromium
#   search   Brave Search MCP, web search only; profile "search", started
#            by start.sh only when BRAVE_API_KEY is set
#   files    the MCP filesystem server behind supergateway, on this folder's
#            agents-fs/ only, behind a bearer key start.sh makes
#
# The tools sit on a network of their own, apart from the database: Playwright
# MCP always offers browser_run_code_unsafe (arbitrary code in its own
# process), so a tool container must not be one hop from the conversations.
# In their containers the tools reach the internet, and the LAN, but not the
# host's 127.0.0.1, its files, or the database.
#
# Started and stopped by start.sh and stop.sh beside it.

name: robinauts-mcp-demo

networks:
  data: {}
  web: {}
  files: {}

volumes:
  pgdata: {}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: robinauts
      POSTGRES_DB: robinauts
      # Read on the first start only, when the volume is empty. start.sh keeps
      # it in .state/pg-password; empty is allowed so that `down` needs nothing.
      POSTGRES_PASSWORD: ${DEMO_PG_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54391:5432"
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "robinauts", "-d", "robinauts"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  fetch:
    build: ./fetch
    ports:
      - "127.0.0.1:8932:8932"
    networks: [web]
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    restart: unless-stopped

  browser:
    image: mcr.microsoft.com/playwright/mcp:latest
    # The image's entrypoint already adds --headless --browser chromium --no-sandbox.
    command:
      - --isolated
      - --host
      - 0.0.0.0
      - --port
      - "8931"
      - --allowed-hosts
      - 127.0.0.1:8933
    ports:
      - "127.0.0.1:8933:8931"
    networks: [web]
    mem_limit: 1g
    pids_limit: 512
    cap_drop: [ALL]
    restart: unless-stopped

  search:
    build: ./search
    profiles: [search]
    environment:
      # Empty is allowed here so that `down` works without a key; start.sh
      # only turns the profile on when the key is set.
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    ports:
      - "127.0.0.1:8934:8934"
    networks: [web]
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    restart: unless-stopped

  files:
    build: ./files
    environment:
      # Empty is allowed here so that `down` works without it; start.sh sets it.
      SUPERGATEWAY_API_KEY: ${DEMO_FILES_KEY:-}
    # As the host user, so what the agent writes is the developer's to edit.
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"
    # An absolute path from start.sh: Docker would make a missing relative one
    # as root.
    volumes:
      - ${DEMO_FILES_DIR:?is set by start.sh and stop.sh}:/agents-fs
    ports:
      - "127.0.0.1:8935:8935"
    networks: [files]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    restart: unless-stopped
