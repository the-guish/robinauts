[project]
name = "robinauts-base-worker"
version = "0.1.0"
description = "The base of an extra worker: the backend's worker module, in a container the server starts."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Robinauts Authors" }]
dependencies = [
    # The worker module, the broker's HTTP client and the engines the backend ships, from the
    # backend beside this folder (tool.uv.sources below): the same build as the server it serves.
    "robinauts",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.uv]
# neorc-from-source: the backend depends on neorc, which uv builds from source.
no-binary-package = ["neorc", "neorc-core", "neorc-ui"]
# Nothing of its own to install: the worker is the backend's module. The tests alone are here.
package = false
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
# Editable, from the checkout: backend/hatch_build.py refuses a wheel built without the
# interface, which a worker never serves.
robinauts = { path = "../../backend", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

# The backend's rules, word for word (backend/pyproject.toml): scripts/check-extra-workers.sh
# runs them over this folder.
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["robinauts"]
