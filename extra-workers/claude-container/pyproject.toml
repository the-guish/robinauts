[project]
name = "robinauts-claude-worker"
version = "0.1.0"
description = "A Robinauts worker that runs its turns on Claude Code, through the Claude Agent SDK."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Robinauts Authors" }]
dependencies = [
    # The worker itself, the broker's HTTP client and the engine contract, from the backend
    # beside this folder (tool.uv.sources below): the same build as the server it serves.
    "robinauts",
    # The Claude Agent SDK, which drives the Claude Code binary it bundles.
    "claude-agent-sdk>=0.2,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
# Editable, from the checkout: backend/hatch_build.py refuses a wheel built without the
# interface, which a worker never serves.
robinauts = { path = "../../backend", editable = true }

[project.scripts]
robinauts-claude-worker = "robinauts_claude_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robinauts_claude_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
pythonpath = ["src"]

# The backend's rules, word for word (backend/pyproject.toml), with this package first-party
# beside robinauts: scripts/check-extra-workers.sh runs them.
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["robinauts", "robinauts_claude_worker"]
