# Read by SonarCloud's automatic analysis. backend/pyproject.toml says
# requires-python >= 3.12, and CI and the demo run 3.12.
sonar.python.version=3.12, 3.13, 3.14

# Every text file in the repository is UTF-8.
sonar.sourceEncoding=UTF-8

# The tests: backend/tests/, the extra workers' and the MCP servers' tests/, and the frontend's
# src/test/ plus the *.test.ts(x) files kept beside the code they test. The same
# patterns are excluded from the sources, so each file is analysed once, as one
# or the other.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=backend/tests/**,extra-workers/*/tests/**,mcp/*/tests/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx

# Images are not source, and read as text they decode to U+FFFD, which Sonar
# reports as "problems with file encoding". The same goes for a literal U+FFFD
# in code, so code spells it as the escape "\ufffd".
sonar.exclusions=backend/tests/**,extra-workers/*/tests/**,mcp/*/tests/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.png,**/*.ico,**/*.jpg,**/*.svg
