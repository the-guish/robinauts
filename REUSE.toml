version = 1

# Every file in the tree has a stated licence. Source files say so in a
# header; the files below cannot carry one, or are better left without.
# LICENSE and LICENSES/ are the Apache Software Foundation's text, not
# ours, and are not listed: reuse treats licence files on their own terms.

[[annotations]]
path = [
    "README.md",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "DEPENDENCIES.md",
    "SECURITY.md",
    "NOTICE",
    "AUTHORS",
    ".gitignore",
    ".gitattributes",
    ".vscode/settings.json",
    "docs/**",
    "demo/README.md",
    "backend/uv.lock",
    "backend/openapi.json",
    "scripts/licence-fixtures.json",
    "extra-workers/README.md",
    "extra-workers/*/README.md",
    "extra-workers/*/uv.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Robinauts Authors"
SPDX-License-Identifier = "Apache-2.0"

# The frontend's files that carry no comment syntax, are documentation, or
# are written by a tool. JSON has no comments; .nvmrc holds a version and
# nothing else; the Markdown follows the root's, which is listed here too; and
# bundled-packages.txt is written by the build, byte for byte, and compared
# with what is committed, so nothing may be added to it by hand.
[[annotations]]
path = [
    "frontend/README.md",
    "frontend/AGENTS.md",
    "frontend/src/icons/README.md",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/tsconfig.json",
    "frontend/tsconfig.app.json",
    "frontend/tsconfig.tools.json",
    "frontend/.nvmrc",
    "frontend/bundled-packages.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Robinauts Authors"
SPDX-License-Identifier = "Apache-2.0"

# The icon data: lucide's, copied in under ADR 0006 and recorded in
# docs/legal/ip-clearance.md. `lucide.ts` is data copied as it was shipped,
# so it carries no header of this project's: that would state our copyright
# over values that are not ours. Lucide's own licence is ISC, and its LICENSE
# states that the icons it derives from Feather are MIT; several of the copied
# icons are among them, so the file carries both. `LICENSE.lucide` is that
# text, listed here so that it says the same of itself; reuse would otherwise
# pass over it as a licence file. `index.tsx` beside them is ours and carries
# the header, and the README is ours and is listed above.
[[annotations]]
path = [
    "frontend/src/icons/lucide.ts",
    "frontend/src/icons/LICENSE.lucide",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2026 Lucide Icons and Contributors",
    "2013-present Cole Bemis",
]
SPDX-License-Identifier = "ISC AND MIT"

# The Gradle wrapper carried with the Android client (clients/android), so the
# client builds against a pinned Gradle without a separate install. The jar is
# a binary, and the properties file is written by Gradle's own `wrapper` task;
# neither is ours to put a header on. The two wrapper scripts beside them carry
# Gradle's own SPDX header already, so they are not listed here.
[[annotations]]
path = [
    "clients/android/gradle/wrapper/gradle-wrapper.jar",
    "clients/android/gradle/wrapper/gradle-wrapper.properties",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

# The Android client's dependency locks. Gradle writes these files whole, so a
# header would not survive the next `--write-locks`.
[[annotations]]
path = [
    "clients/android/buildscript-gradle.lockfile",
    "clients/android/settings-gradle.lockfile",
    "clients/android/app/gradle.lockfile",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Robinauts Authors"
SPDX-License-Identifier = "Apache-2.0"
