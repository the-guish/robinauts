version = 1

# Every file in the tree has a stated licence. Source files say so in a
# header; the files below cannot carry one, or are better left without.
# LICENSE and LICENSES/ are the Apache Software Foundation's text, not
# ours, and are not listed: reuse treats licence files on their own terms.

[[annotations]]
path = [
    "README.md",
    "CONTRIBUTING.md",
    "DEPENDENCIES.md",
    "SECURITY.md",
    "NOTICE",
    "AUTHORS",
    ".gitignore",
    ".gitattributes",
    ".vscode/settings.json",
    "docs/**",
    "demo/README.md",
    "backend/uv.lock",
    "backend/openapi.json",
    "scripts/licence-fixtures.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Robinauts Authors"
SPDX-License-Identifier = "Apache-2.0"

# The frontend's files that carry no comment syntax, are documentation, or
# are written by a tool. JSON has no comments; .nvmrc holds a version and
# nothing else; the Markdown follows the root's, which is listed here too; and
# bundled-packages.txt is written by the build, byte for byte, and compared
# with what is committed, so nothing may be added to it by hand.
[[annotations]]
path = [
    "frontend/README.md",
    "frontend/AGENTS.md",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/tsconfig.json",
    "frontend/tsconfig.app.json",
    "frontend/tsconfig.tools.json",
    "frontend/.nvmrc",
    "frontend/bundled-packages.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Robinauts Authors"
SPDX-License-Identifier = "Apache-2.0"

# The clients' files that carry no comment syntax or are written by a tool:
# the Markdown, as the root's, and the connectors' lockfile.
[[annotations]]
path = [
    "clients/README.md",
    "clients/connectors/README.md",
    "clients/connectors/uv.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Robinauts Authors"
SPDX-License-Identifier = "Apache-2.0"

# The vendored chat components: somebody else's MIT source, copied in under
# the rules of ADR 0001 and recorded in docs/legal/ip-clearance.md. They carry
# no header because they carry no edit that is not listed in their README:
# adding one to every file would be a change to re-apply at every re-sync, and
# it would state this project's copyright over code that is not its own. Two
# upstreams, so two blocks; `frontend/src/chat/assistant-ui/vendor/README.md`
# is ours and says which file came from which.
[[annotations]]
path = ["frontend/src/chat/assistant-ui/vendor/components/ui/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 shadcn"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "frontend/src/chat/assistant-ui/vendor/components/assistant-ui/**",
    "frontend/src/chat/assistant-ui/vendor/hooks/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 AgentbaseAI Inc."
SPDX-License-Identifier = "MIT"

# The two files in that directory that are this project's: the README, and
# `lib/utils.ts`, which is written here rather than copied (its header says so
# as well; `precedence = "aggregate"` leaves that header in charge).
[[annotations]]
path = [
    "frontend/src/chat/assistant-ui/vendor/README.md",
    "frontend/src/chat/assistant-ui/vendor/lib/utils.ts",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Robinauts Authors"
SPDX-License-Identifier = "Apache-2.0"
