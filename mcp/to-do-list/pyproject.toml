[project]
name = "robinauts-mcp-to-do-list"
version = "0.1.0"
description = "A to-do list as an MCP server, with a view for hosts that show MCP Apps."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Robinauts Authors" }]
dependencies = [
    # The MCP SDK, at the version backend/uv.lock pins: one vetted copy of it in the repository.
    "mcp==1.30.0",
]

[project.scripts]
robinauts-to-do-list = "to_do_list.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.uv]
# The platforms the backend's lock resolves for, and no other.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package, its view (app.html) included.
packages = ["src/to_do_list"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

# The backend's rules, word for word (backend/pyproject.toml): scripts/check-mcp-servers.sh
# runs them over this folder.
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["to_do_list"]
