#
# The kataloop engine keeps its memory in the server's process until
# kataloop[postgres] exists: a restart forgets what its conversations said, and
# their next turn fails (docs/specs/agent-engines.md). It reaches the
# anthropic, anthropic-compatible and openai-compatible kinds.

[model_providers.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[models.haiku]
provider = "anthropic"
name = "claude-haiku-4-5"
title = "Claude Haiku 4.5"
max_output_tokens = 1024

[agents.assistant]
title = "Assistant"
system_prompt = "You are a helpful assistant. Answer briefly."
model = "haiku"
engine = "kataloop"
