# JVM options for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the AndroidX libraries, and give each module a non-transitive R class so
# it sees only its own resources.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin's official code style.
kotlin.code.style=official
